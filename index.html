<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prosnopotro · প্রশ্নপত্র জেনারেটর</title>
  <p>v1.05</p>
<link rel="preconnect" href="https://fonts.maateen.me">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { colors: {
    paper: { light: '#f7f5f0', dark: '#1a1815' },
    surface: { light: '#ffffff', dark: '#262220' },
    edge: { light: '#e7e3d9', dark: '#3f3a34' },
    ink: { DEFAULT:'#1a1815', muted:'#6b6459', subtle:'#9c9488', dark:'#e7e5e4', 'dark-muted':'#a8a29e' },
    brand: { 50:'#eef6f5', 100:'#d5e5e3', 200:'#a9cbc8', 500:'#2b726d', 600:'#115e59', 700:'#0c4a47' },
    ember: { 50:'#fdf4e7', 100:'#fbe8c7', 500:'#b45309', 600:'#92400e', 700:'#78350f' }
  }}}
};
</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
<link href="https://fonts.maateen.me/nikosh/font.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen p-4 bg-paper-light dark:bg-paper-dark text-ink dark:text-ink-dark">

<div class="max-w-[1500px] mx-auto">

  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4 no-print">
    <div class="flex items-center gap-3 flex-wrap">
      <h1 class="text-2xl font-bold text-brand-700 dark:text-brand-200 tracking-tight">Prosnopotro</h1>
      <span id="cacheStatus" class="hidden text-[13px] leading-none px-2.5 py-1 rounded-full border"></span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="runSpellCheck()" id="spellBtn" title="বানান পরীক্ষা"
        class="bg-surface-light dark:bg-surface-dark border border-edge-light dark:border-edge-dark rounded-full px-3 py-1.5 text-sm font-semibold hover:border-brand-500 dark:hover:border-brand-200 transition flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
        </svg>
        <span id="spellBtnText">বানান পরীক্ষা</span>
      </button>
      <button onclick="toggleDark()" id="darkBtn" aria-label="Theme"
        class="bg-surface-light dark:bg-surface-dark border border-edge-light dark:border-edge-dark rounded-full w-9 h-9 flex items-center justify-center hover:border-brand-500 dark:hover:border-brand-200 transition">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path><path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>
      <a href="https://github.com/Opirajbhor" target="_blank" rel="noopener"
         class="flex items-center gap-2 bg-surface-light dark:bg-surface-dark border border-edge-light dark:border-edge-dark rounded-full pl-1 pr-3 py-1 hover:border-brand-500 dark:hover:border-brand-200 transition">
        <img src="https://github.com/Opirajbhor.png" alt="Opirajbhor" loading="lazy"
             class="w-8 h-8 rounded-full border border-edge-light dark:border-edge-dark" />
        <span class="text-sm font-semibold">Opirajbhor</span>
      </a>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-10 gap-6">

    <!-- Form -->
    <div class="lg:order-2 lg:col-span-3 no-print scroll-col pr-1">
      <div class="bg-surface-light dark:bg-surface-dark rounded-xl border border-edge-light dark:border-edge-dark p-4 space-y-3">

        <div>
          <label class="block text-xs font-semibold text-ink-muted dark:text-ink-dark-muted mb-1.5">প্রশ্নের ধরন</label>
          <div class="grid grid-cols-2 gap-1 bg-stone-100 dark:bg-brand-700/20 rounded-lg p-1 border border-edge-light dark:border-edge-dark">
            <button id="modeBtnCreative" onclick="setMode('creative')" class="mode-btn py-2 px-3 text-sm font-semibold rounded-md transition text-ink-muted dark:text-ink-dark-muted hover:text-ink dark:hover:text-ink-dark">সৃজনশীল</button>
            <button id="modeBtnMcq" onclick="setMode('mcq')" class="mode-btn py-2 px-3 text-sm font-semibold rounded-md transition text-ink-muted dark:text-ink-dark-muted hover:text-ink dark:hover:text-ink-dark">নৈর্ব্যত্তিক</button>
          </div>
        </div>

        <div class="bg-brand-50 dark:bg-brand-700/20 border border-brand-200 dark:border-brand-700 rounded-lg p-2.5">
          <label class="block text-xs font-semibold text-brand-700 dark:text-brand-200 mb-1">প্রিসেট</label>
          <div class="flex gap-1">
            <select id="presetSelect" onchange="loadPreset()"
              class="flex-1 rounded-md border border-brand-200 dark:border-brand-700 px-2 py-1.5 text-sm bg-white dark:bg-surface-dark dark:text-ink-dark min-w-0">
              <option value="">-- --</option>
            </select>
            <button onclick="savePreset()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-2.5 rounded-md transition">Save</button>
            <button onclick="updatePreset()" class="bg-ember-500 hover:bg-ember-600 text-white text-xs font-semibold px-2.5 rounded-md transition">Update</button>
            <button onclick="deletePreset()" class="bg-white dark:bg-surface-dark border border-brand-200 dark:border-brand-700 hover:bg-brand-50 dark:hover:bg-brand-700/30 text-brand-700 dark:text-brand-200 text-xs font-semibold px-2.5 rounded-md transition">Del</button>
          </div>
        </div>

        <div class="border-2 border-dashed border-brand-500/40 dark:border-brand-500/30 rounded-lg p-3 bg-brand-50/40 dark:bg-brand-700/10">
          <div class="flex items-start gap-2 mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-600 dark:text-brand-200 mt-0.5 shrink-0">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <div class="flex-1">
              <div class="text-xs font-semibold text-brand-700 dark:text-brand-200">Import</div>
              <p class="text-[10.5px] text-ink-subtle dark:text-ink-dark-muted leading-snug mt-0.5">Prosnopotro থেকে Export করা .doc বা .pdf ফাইল থেকে সব ডেটা ফিরিয়ে আনুন</p>
            </div>
          </div>
          <button onclick="triggerImport()" class="w-full bg-white dark:bg-surface-dark border border-brand-500/50 dark:border-brand-500/40 hover:bg-brand-50 dark:hover:bg-brand-700/20 text-brand-700 dark:text-brand-200 text-xs font-semibold px-3 py-2 rounded-md transition">ফাইল বাছুন</button>
          <input type="file" id="docImportInput" accept=".doc,.html,.pdf,application/msword,application/pdf" class="hidden" onchange="handleImport(event)">
        </div>

        <div>
          <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">১. বিদ্যালয়ের নাম</label>
          <input id="school" value="বাজিতপুর হাফেজ আব্দুর রাজ্জাক পাইলট মডেল উচ্চ বিদ্যালয়" class="w-full rounded-md border border-edge-light dark:border-edge-dark bg-white dark:bg-surface-dark px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">২. পরীক্ষার নাম</label>
          <input id="exam" value="বার্ষিক পরীক্ষা ২০২৬ খ্রি." class="w-full rounded-md border border-edge-light dark:border-edge-dark bg-white dark:bg-surface-dark px-3 py-2 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">৩. শ্রেণি</label>
            <select id="class" class="w-full rounded-md border border-edge-light dark:border-edge-dark px-3 py-2 text-sm bg-white dark:bg-surface-dark">
              <option>ষষ্ঠ</option><option>সপ্তম</option><option>অষ্টম</option><option>নবম</option><option>দশম</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">৪. বিষয়</label>
            <select id="subject" onchange="autoFillCode()" class="w-full rounded-md border border-edge-light dark:border-edge-dark px-3 py-2 text-sm bg-white dark:bg-surface-dark"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">৫. বিষয় কোড</label>
            <input id="subjectCode" placeholder="স্বয়ংক্রিয়" class="w-full rounded-md border border-edge-light dark:border-edge-dark bg-stone-100 dark:bg-surface-dark px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">৬. সময়</label>
            <select id="time" class="w-full rounded-md border border-edge-light dark:border-edge-dark px-3 py-2 text-sm bg-white dark:bg-surface-dark">
              <option>৩০ মিনিট</option><option>৪৫ মিনিট</option><option>১ ঘন্টা</option>
              <option>১ ঘন্টা ৩০ মিনিট</option><option>২ ঘন্টা</option>
              <option selected>২ ঘন্টা ৩০ মিনিট</option><option>৩ ঘন্টা</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">৭. পূর্ণমান</label>
            <select id="fullmark" class="w-full rounded-md border border-edge-light dark:border-edge-dark px-3 py-2 text-sm bg-white dark:bg-surface-dark">
              <option>৭০</option><option>১০০</option><option>৩০</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">৮. ফন্ট সাইজ</label>
            <input type="number" id="fontSize" value="12" min="8" max="24" class="w-full rounded-md border border-edge-light dark:border-edge-dark bg-white dark:bg-surface-dark px-3 py-2 text-sm">
          </div>
          <div class="col-span-2">
            <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">৯. ফন্ট ফ্যামিলি</label>
            <select id="fontFamily" class="w-full rounded-md border border-edge-light dark:border-edge-dark px-3 py-2 text-sm bg-white dark:bg-surface-dark">
              <option value="Nikosh">Nikosh</option>
              <option value="Kalpurush">Kalpurush</option>
            </select>
          </div>
          <div class="col-span-2">
            <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">১০. এনকোডিং</label>
            <select id="encoding" onchange="onEncodingChange()" class="w-full rounded-md border border-edge-light dark:border-edge-dark px-3 py-2 text-sm bg-white dark:bg-surface-dark">
              <option value="unicode">ইউনিকোড</option>
              <option value="bijoy">বিজয়</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-ink-muted dark:text-ink-dark-muted mb-1">১১. নির্দেশনা</label>
          <textarea id="instructions" rows="4" class="w-full rounded-md border border-edge-light dark:border-edge-dark bg-white dark:bg-surface-dark px-3 py-2 text-sm">[বি:দ্র: সংক্ষিপ্ত অংশ হতে যেকোনো ১০টি এবং সৃজনশীল অংশ হতে যেকোনো ০৫ টি প্রশ্নের উত্তর দাও।]</textarea>
        </div>

        <div id="creativeFields" class="space-y-3">
          <div class="border-t border-dashed border-edge-light dark:border-edge-dark pt-3">
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-medium text-ink-muted dark:text-ink-dark-muted">১২. সংক্ষিপ্ত অংশ</label>
              <button type="button" id="micSmall" onclick="toggleVoice('pasteSmall')" class="mic-btn hidden text-[11px] bg-white dark:bg-surface-dark border border-edge-light dark:border-edge-dark px-2 py-1 rounded-md">🎤</button>
            </div>
            <div class="format-toolbar flex gap-1 mb-1">
              <button type="button" onclick="applyFormat('pasteSmall','bold')" class="text-xs font-bold px-2 py-0.5 border border-edge-light dark:border-edge-dark rounded hover:bg-stone-100 dark:hover:bg-brand-700/20">B</button>
              <button type="button" onclick="applyFormat('pasteSmall','italic')" class="text-xs italic px-2 py-0.5 border border-edge-light dark:border-edge-dark rounded hover:bg-stone-100 dark:hover:bg-brand-700/20">I</button>
            </div>
            <textarea id="pasteSmall" rows="6" class="w-full rounded-md border border-edge-light dark:border-edge-dark bg-white dark:bg-surface-dark px-3 py-2 text-sm"></textarea>
            <div id="spellSmall" class="text-[11px] mt-1"></div>
          </div>
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-medium text-ink-muted dark:text-ink-dark-muted">১৩. সৃজনশীল অংশ</label>
              <button type="button" id="micMain" onclick="toggleVoice('pasteMain')" class="mic-btn hidden text-[11px] bg-white dark:bg-surface-dark border border-edge-light dark:border-edge-dark px-2 py-1 rounded-md">🎤</button>
            </div>
            <div class="format-toolbar flex gap-1 mb-1">
              <button type="button" onclick="applyFormat('pasteMain','bold')" class="text-xs font-bold px-2 py-0.5 border border-edge-light dark:border-edge-dark rounded hover:bg-stone-100 dark:hover:bg-brand-700/20">B</button>
              <button type="button" onclick="applyFormat('pasteMain','italic')" class="text-xs italic px-2 py-0.5 border border-edge-light dark:border-edge-dark rounded hover:bg-stone-100 dark:hover:bg-brand-700/20">I</button>
            </div>
            <textarea id="pasteMain" rows="14" class="w-full rounded-md border border-edge-light dark:border-edge-dark bg-white dark:bg-surface-dark px-3 py-2 text-sm"></textarea>
            <div id="spellMain" class="text-[11px] mt-1"></div>
          </div>
        </div>

        <div id="mcqFields" class="hidden space-y-3">
          <div class="border-t border-dashed border-edge-light dark:border-edge-dark pt-3">
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-medium text-ink-muted dark:text-ink-dark-muted">১২. নৈর্ব্যত্তিক অংশ</label>
              <button type="button" id="micMcq" onclick="toggleVoice('pasteMcq')" class="mic-btn hidden text-[11px] bg-white dark:bg-surface-dark border border-edge-light dark:border-edge-dark px-2 py-1 rounded-md">🎤</button>
            </div>
            <div class="format-toolbar flex gap-1 mb-1">
              <button type="button" onclick="applyFormat('pasteMcq','bold')" class="text-xs font-bold px-2 py-0.5 border border-edge-light dark:border-edge-dark rounded hover:bg-stone-100 dark:hover:bg-brand-700/20">B</button>
              <button type="button" onclick="applyFormat('pasteMcq','italic')" class="text-xs italic px-2 py-0.5 border border-edge-light dark:border-edge-dark rounded hover:bg-stone-100 dark:hover:bg-brand-700/20">I</button>
            </div>
            <textarea id="pasteMcq" rows="16" placeholder="রাজধানীর নাম কী?
ক) ঢাকা
খ) চট্টগ্রাম
গ) খুলনা
ঘ) রাজশাহী"
              class="w-full rounded-md border border-edge-light dark:border-edge-dark bg-white dark:bg-surface-dark px-3 py-2 text-sm font-mono"></textarea>
            <div id="spellMcq" class="text-[11px] mt-1"></div>
          </div>
        </div>

        <div id="dupWarn" class="hidden text-[12px] rounded-md border border-amber-500/40 bg-amber-50 dark:bg-amber-700/20 text-amber-800 dark:text-amber-300 px-3 py-2"></div>

        <div class="flex items-center justify-between gap-2 pt-1">
          <button onclick="clearAll()" class="bg-white dark:bg-surface-dark border border-edge-light dark:border-edge-dark hover:bg-stone-100 dark:hover:bg-brand-700/20 text-ink dark:text-ink-dark text-sm font-medium px-4 py-2 rounded-md transition">Clear</button>
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="lg:order-1 lg:col-span-7 scroll-col pr-1">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2 no-print sticky top-0 z-20 bg-paper-light dark:bg-paper-dark py-1">
        <h2 class="text-sm font-semibold text-ink-muted dark:text-ink-dark-muted">প্রিভিউ (A4)</h2>
        <div class="flex flex-wrap gap-2">
          <button onclick="doPrint()" class="bg-slate-600 hover:bg-slate-700 text-white text-xs font-semibold px-3.5 py-2 rounded-md transition shadow-sm">Print</button>
          <button onclick="toggleQR()" id="qrBtn" title="QR কোড দেখাও/লুকাও"
            class="bg-slate-600 hover:bg-slate-700 text-white text-xs font-semibold px-3.5 py-2 rounded-md transition shadow-sm flex items-center gap-1.5">
            <span id="qrBtnText">QR ✓</span>
          </button>
          <div class="relative">
            <button onclick="toggleExportMenu(event)"
              class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-3.5 py-2 rounded-md transition shadow-sm flex items-center gap-1.5">
              Export
            </button>
            <div id="exportMenu" class="hidden absolute right-0 mt-1 w-48 bg-surface-light dark:bg-surface-dark border border-edge-light dark:border-edge-dark rounded-lg shadow-lg py-1 z-30">
              <button onclick="exportDoc()" class="w-full text-left text-xs px-3 py-2 hover:bg-stone-100 dark:hover:bg-brand-700/20">Export as Doc</button>
              <button onclick="exportPdf()" class="w-full text-left text-xs px-3 py-2 hover:bg-stone-100 dark:hover:bg-brand-700/20">Export as PDF</button>
              <button onclick="exportPng()" class="w-full text-left text-xs px-3 py-2 hover:bg-stone-100 dark:hover:bg-brand-700/20">Export as PNG</button>
              <div class="border-t border-edge-light dark:border-edge-dark my-1"></div>
              <button onclick="copyAsText()" class="w-full text-left text-xs px-3 py-2 hover:bg-stone-100 dark:hover:bg-brand-700/20">Copy as Text</button>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="text-xs text-ink-subtle dark:text-ink-dark-muted mb-1 no-print">পৃষ্ঠা ১</div>
        <div class="a4-page-wrap"><div class="a4-page shadow border border-edge-light dark:border-edge-dark rounded-lg" id="page1"></div></div>
      </div>
      <div id="page2-wrapper" class="hidden">
        <div class="text-xs text-ink-subtle dark:text-ink-dark-muted mb-1 no-print">পৃষ্ঠা ২</div>
        <div class="a4-page-wrap"><div class="a4-page shadow border border-edge-light dark:border-edge-dark rounded-lg" id="page2"></div></div>
      </div>
    </div>

  </div>
</div>

<!-- Image Editor Modal -->
<div id="imgEditorModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 no-print">
  <div class="bg-surface-light dark:bg-surface-dark rounded-xl border border-edge-light dark:border-edge-dark max-w-3xl w-full max-h-[90vh] flex flex-col">
    <div class="flex items-center justify-between p-3 border-b border-edge-light dark:border-edge-dark">
      <h3 class="text-sm font-semibold">ছবি সম্পাদনা</h3>
      <button onclick="closeImgEditor()" class="w-7 h-7 rounded-full hover:bg-stone-100 dark:hover:bg-brand-700/20 flex items-center justify-center">✕</button>
    </div>
    <div class="flex-1 overflow-auto p-3 bg-stone-100 dark:bg-brand-700/10">
      <div class="relative inline-block" id="canvasWrap">
        <canvas id="imgEditorCanvas"></canvas>
        <div id="cropOverlay"></div>
      </div>
      <p class="text-[11px] text-ink-subtle mt-2 text-center">ছবিতে ড্র্যাগ করে ক্রপ করুন</p>
    </div>
    <div class="p-3 space-y-3 border-t border-edge-light dark:border-edge-dark">
      <div class="flex flex-wrap gap-1">
        <button onclick="applyImgFilter('none')" data-filter="none" class="img-filter-btn active text-xs px-2.5 py-1 rounded border border-edge-light dark:border-edge-dark">মূল</button>
        <button onclick="applyImgFilter('bw')" data-filter="bw" class="img-filter-btn text-xs px-2.5 py-1 rounded border border-edge-light dark:border-edge-dark">সাদাকালো</button>
        <button onclick="applyImgFilter('highcontrast')" data-filter="highcontrast" class="img-filter-btn text-xs px-2.5 py-1 rounded border border-edge-light dark:border-edge-dark">উচ্চ কনট্রাস্ট</button>
        <button onclick="applyImgFilter('sepia')" data-filter="sepia" class="img-filter-btn text-xs px-2.5 py-1 rounded border border-edge-light dark:border-edge-dark">সেপিয়া</button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[11px] font-medium">উজ্জ্বলতা: <span id="brightnessVal">0</span></label>
          <input type="range" id="brightnessSlider" min="-100" max="100" value="0" oninput="onSliderChange()" class="w-full">
        </div>
        <div>
          <label class="text-[11px] font-medium">কনট্রাস্ট: <span id="contrastVal">0</span></label>
          <input type="range" id="contrastSlider" min="-100" max="100" value="0" oninput="onSliderChange()" class="w-full">
        </div>
      </div>
      <div class="flex flex-wrap gap-1">
        <button onclick="rotateImg(-90)" class="text-xs px-2.5 py-1 border border-edge-light dark:border-edge-dark rounded">↺ ৯০°</button>
        <button onclick="rotateImg(90)" class="text-xs px-2.5 py-1 border border-edge-light dark:border-edge-dark rounded">↻ ৯০°</button>
        <button onclick="clearCrop()" class="text-xs px-2.5 py-1 border border-edge-light dark:border-edge-dark rounded">ক্রপ বাতিল</button>
      </div>
    </div>
    <div class="p-3 border-t border-edge-light dark:border-edge-dark flex flex-wrap justify-between gap-2">
      <button onclick="removeImageFromPaper()" class="text-xs px-3 py-2 bg-red-50 dark:bg-red-700/20 border border-red-500/40 text-red-700 dark:text-red-300 rounded-md font-semibold">🗑 ছবি মুছুন</button>
      <div class="flex gap-2">
        <button onclick="resetImgEditor()" class="text-xs px-3 py-2 border border-edge-light dark:border-edge-dark rounded-md">রিসেট</button>
        <button onclick="closeImgEditor()" class="text-xs px-3 py-2 border border-edge-light dark:border-edge-dark rounded-md">বাতিল</button>
        <button onclick="saveImgEdit()" class="text-xs px-3 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-md font-semibold">সংরক্ষণ</button>
      </div>
    </div>
  </div>
</div>

<!-- Table Editor Modal -->
<div id="tableEditorModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 no-print">
  <div class="bg-surface-light dark:bg-surface-dark rounded-xl border border-edge-light dark:border-edge-dark max-w-3xl w-full max-h-[90vh] flex flex-col">
    <div class="flex items-center justify-between p-3 border-b border-edge-light dark:border-edge-dark">
      <h3 class="text-sm font-semibold">টেবিল সম্পাদনা</h3>
      <button onclick="closeTableEditor()" class="w-7 h-7 rounded-full hover:bg-stone-100 dark:hover:bg-brand-700/20 flex items-center justify-center">✕</button>
    </div>
    <div class="p-3 space-y-2 border-b border-edge-light dark:border-edge-dark">
      <div class="flex flex-wrap gap-2 items-center">
        <label class="text-[11px] font-medium">সারি:</label>
        <input type="number" id="tblRows" min="2" max="10" value="3" class="w-16 rounded border border-edge-light dark:border-edge-dark px-2 py-1 text-xs bg-white dark:bg-surface-dark">
        <label class="text-[11px] font-medium">কলাম:</label>
        <input type="number" id="tblCols" min="2" max="6" value="3" class="w-16 rounded border border-edge-light dark:border-edge-dark px-2 py-1 text-xs bg-white dark:bg-surface-dark">
        <button onclick="resizeTable()" class="text-xs px-2 py-1 bg-brand-600 hover:bg-brand-700 text-white rounded">রিসাইজ</button>
        <label class="text-[11px] font-medium flex items-center gap-1">
          <input type="checkbox" id="tblHeader" checked> হেডার
        </label>
      </div>
      <div class="text-[10px] text-ink-subtle">Excel/Sheets থেকে কপি করে যেকোনো সেলে পেস্ট করলে পুরো টেবিল আপডেট হবে</div>
    </div>
    <div class="flex-1 overflow-auto p-3 bg-stone-100 dark:bg-brand-700/10" id="tblGridContainer"></div>
    <div class="p-3 border-t border-edge-light dark:border-edge-dark flex flex-wrap justify-between gap-2">
      <div class="flex gap-1">
        <button onclick="addTableRow()" class="text-xs px-2.5 py-1 border border-edge-light dark:border-edge-dark rounded">+ সারি</button>
        <button onclick="removeTableRow()" class="text-xs px-2.5 py-1 border border-edge-light dark:border-edge-dark rounded">- সারি</button>
        <button onclick="addTableCol()" class="text-xs px-2.5 py-1 border border-edge-light dark:border-edge-dark rounded">+ কলাম</button>
        <button onclick="removeTableCol()" class="text-xs px-2.5 py-1 border border-edge-light dark:border-edge-dark rounded">- কলাম</button>
      </div>
      <div class="flex gap-2">
        <button onclick="closeTableEditor()" class="text-xs px-3 py-2 border border-edge-light dark:border-edge-dark rounded-md">বাতিল</button>
        <button onclick="saveTableEdit()" class="text-xs px-3 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-md font-semibold">সংরক্ষণ</button>
      </div>
    </div>
  </div>
</div>

<!-- Export Loading -->
<div id="exportLoading" class="hidden fixed inset-0 bg-black/50 z-[100] flex items-center justify-center no-print">
  <div class="bg-white dark:bg-slate-800 rounded-xl px-6 py-5 flex items-center gap-3 shadow-2xl">
    <div class="w-5 h-5 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
    <span class="text-sm font-semibold">Export হচ্ছে…</span>
  </div>
</div>

<input type="file" id="imgPicker" accept="image/*" class="hidden" onchange="handleImagePick(event)">

<script src="app.js"></script>
</body>
</html>
